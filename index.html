<head>

<title>Which one is getting married?</title>
<style>
  :root{
    --paper:#eef1ec;
    --paper-raised:#f8faf6;
    --ink:#1e2a24;
    --ink-soft:#5b6b62;
    --line:#c9d1c6;
    --accent:#3f6357;
    --accent-soft:#e3ece7;
    --gold:#b98a3e;
    --danger:#a34e3f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:32px 16px 56px;
  }
  .wrap{ width:100%; max-width:760px; }

  /* ---- header / progress ---- */
  header{ margin-bottom:28px; }
  .brand{
    font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:14px; text-align:center;
  }
  .progress-track{
    display:flex; gap:4px; width:100%;
  }
  .progress-seg{
    flex:1; height:4px; border-radius:2px; background:var(--line);
    transition:background .25s ease;
  }
  .progress-seg.done{ background:var(--accent); }
  .progress-seg.current{ background:var(--gold); }
  .progress-label{
    margin-top:10px; font-size:13px; color:var(--ink-soft); text-align:center;
  }

  /* ---- question ---- */
  .question{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:22px; line-height:1.4; text-align:center;
    margin:8px 0 26px; color:var(--ink);
  }
  .subtext{
    text-align:center; font-size:14px; color:var(--ink-soft); margin-bottom:30px;
  }

  /* ---- cards ---- */
  .cards{
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  @media (max-width:640px){
    .cards{ grid-template-columns:1fr; }
  }
  .card{
    background:var(--paper-raised);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    text-align:left;
    cursor:pointer;
    display:flex; flex-direction:column;
    transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .card:hover{
    border-color:var(--accent);
    box-shadow:0 2px 14px rgba(63,99,87,0.12);
  }
  .card:active{ transform:scale(0.995); }
  .card.selected{
    border-color:var(--gold);
    background:var(--accent-soft);
    box-shadow:0 2px 14px rgba(185,138,62,0.18);
  }
  .card.dimmed{
    opacity:.45; cursor:default; pointer-events:none;
  }
  .card-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:12px;
  }
  .card-time{
    color:var(--gold); font-weight:600;
  }
  .card-text{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:16px; line-height:1.55; color:var(--ink);
    white-space:pre-wrap;
  }

  /* ---- footer controls ---- */
  .status-row{
    margin-top:24px; min-height:22px; text-align:center;
    font-size:13px; color:var(--ink-soft);
  }

  /* ---- intro / consent screen ---- */
  .panel{
    background:var(--paper-raised); border:1.5px solid var(--line);
    border-radius:var(--radius); padding:32px 28px;
  }
  .panel h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:26px; margin:0 0 14px;
  }
  .panel p{ line-height:1.6; color:var(--ink); font-size:15px; }
  .panel ul{ line-height:1.7; color:var(--ink); font-size:15px; padding-left:20px; }
  .btn{
    display:inline-block; margin-top:18px;
    background:var(--accent); color:#fff; border:none;
    padding:13px 26px; border-radius:999px;
    font-size:15px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{ background:#345349; }
  .btn:disabled{ background:var(--line); cursor:default; }

  /* ---- end screen ---- */
  .end-icon{
    width:44px; height:44px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex;
    align-items:center; justify-content:center; font-size:22px;
    margin:0 auto 18px;
  }
  .fine-print{ font-size:12px; color:var(--ink-soft); margin-top:22px; line-height:1.6; }
</style>
</head>

k me to this fancy bar as our first date and my drink was 15 dollars and we ordered 2 rounds. He's busy with school and work and i get that but all we ever do is get Starbucks and sit in his car or go back to his place and watch movies. Iv...", "time_ago": "5.1 years ago", "label": 1, "model_prob": 1.0}, {"bag_id": 6, "orig_id": 169, "text": "What do people do on Valentine\u2019s Day? This is my (27F) first time being in a relationship on Valentine\u2019s Day. My bf is flying to stay with me and I am excited and nervous. I want to plan something special but I don\u2019t know what. Any ideas?", "time_ago": "3.5 years ago", "label": 0, "model_prob": 0.6673}, {"bag_id": 7, "orig_id": 110, "text": "Hello, is my(18F) bf(18M) trying to get me out of his life? Need men\u2019s perspectives, it\u2019s about his friends. So it has been almost 2 months my bf and his one close friend especially and others too that have reunited after 1.5 years apart. He spends too much time with the close one friend and the others but not that much. He sleeps at his place too often and all that. He always told me I\u2019m the most important person to him after he\u2019s family because I\u2019m like family to him and love him like no one does in his family ( his words ). But lately i feel like his friend took my place. We\u2019re long distance 2 hour away, he\u2019s here for Easter break. These 2 weeks have been hell for me. He doesn\u2019t express his feelings anymore , he\u2019s texting like we\u2019re friends no more sweet words no more I love you no more anything to show me I\u2019m important to him. All these started when he reunited with him. I don\u2019t know...", "time_ago": "14 months ago", "label": 0, "model_prob": 0.5473}, {"bag_id": 8, "orig_id": 52, "text": "Is hinge + worth paying for? I\u2019ve been using the free version of Hinge for a while but haven\u2019t had much luck matching with people in my area. I\u2019m debating whether to try Hinge+ but not sure if it\u2019s actually worth it (it\u2019s 50% off currently for 30 more mins lol) do you really get more matches or better results? Would love to hear from anyone who\u2019s tried it and whether it made a difference for you.", "time_ago": "8 months ago", "label": 0, "model_prob": 0.6799}, {"bag_id": 9, "orig_id": 30, "text": "Am I being too picky about texting consistency before even meeting? I (26F) recently started talking to a guy (30M) I met on Hinge and I\u2019m trying to figure out if I\u2019m overreacting or if this is an early compatibility issue. We\u2019ve only been talking for a short time but we had a really long phone call (almost 2 hours) that actually went really well. The conversation flowed after the first few minutes, he seemed thoughtful, asked about my life, shared about his work, and we even planned a first date for next week. So initially I felt pretty good about him.\n\nWhat\u2019s bothering me is his texting pattern. He tends to text only after he finishes his workday, like around 6pm or later. When he does text, the conversation is good and he asks about my day and responds thoughtfully. Yesterday he texted around 6:20pm and we chatted back and forth until about 8:30pm. My last messages were more like stat...", "time_ago": "5 months ago", "label": 0, "model_prob": 0.2189}, {"bag_id": 10, "orig_id": 0, "text": "Am I toxic? So I (22F) recently got into my first serious relationship. Fair warning, I think I\u2019m a recovering \u201cavoidant\u201d when it comes to relationships.\n\nMe and this guy are going on two months now, and I absolutely love being around him. When he\u2019s with me I literally feel like I\u2019m on a high. But when we are apart and FaceTime, I can\u2019t stand it? Like I enjoy talking to him for a bit but he wants to go on for hours and it becomes almost like an annoyance because I have other things I need to get done. And I feel like we should be enjoying this time apart. Does this make me toxic? I feel like I should always want to be talking to him-especially this early on.", "time_ago": "16 months ago", "label": 0, "model_prob": 0.3058}, {"bag_id": 11, "orig_id": 23, "text": "Avoidant attachment is not attractive?  I\u2019ve seen a lot of reels or videos on how avoidant attachment might be attractive especially to anxious attachers. That is if people feel you are pulling away they\u2019ll try to get to you.\n\nBut in my (28F) experience, I\u2019ve always turned men off if they feel I am not that interested or something. I miss out on one or two phone calls or meetups, they either think there is some other guy or that I\u2019m not that interested and they cut me off. \n\nAvoidant attachment style is so painful and filled with regrets. At least with anxious attachment you feel you\u2019re giving your all. I always regret in hindsight that I liked a guy so much, I wish I\u2019d pushed myself to connect with him more. \n\nWhy are guys becoming so easily turned off by avoidance? Or is it that my avoidance comes too soon? Like even before getting in a relationship, right at the juncture of dating.", "time_ago": "21 months ago", "label": 0, "model_prob": 0.1225}, {"bag_id": 12, "orig_id": 182, "text": "M29 f29 is this wife material ? Ok quick biography:\n- m30, only had 4-5 girls all my life that have given me the crush butterflies\n- haven't really dated at all in the past 10 years, just random bar hookups 10years\n-got my heart broken, took me 7 years to get over, until I met a girl one night, hooked up, then texted a bit, that's all\n- last few years, just keeping myself busy with house/car projects as a hobby, avoiding dating\n- few months ago, \"Im getting old lets try I online what ever YouTube dating confidence there is\"\n-first girl in nothing like her pictures, second girl asks me out, no text back,\n-third girl too shy but interesting, worth a second date.\n\n-Now here is where I am a mess. A few months ago I was getting back into the dating scene, had extreme confidence, perfect girl in my head. Started getting in online dating and \"build a stable\" Got overwhelmed, went on three dates...", "time_ago": "2.7 years ago", "label": 1, "model_prob": 1.0}, {"bag_id": 13, "orig_id": 11, "text": "how not to feel? honestly i (M24) feel tired, i\u2019ve had a sequence of really good dates that have led to nothing, and by nothing i don\u2019t mean just not leading to a relationship or a second date, i mean like, you and this person had this beautiful night and you felt something really strong, and two days after you\u2019re having to deal with the fact it\u2019s unceremoniously not moving forward, and i don\u2019t understand why, because i know for a fact it was as good for them as it was for me, and i don\u2019t know what to do anymore honestly, because i feel for it too much every single time, specially being a naturally romantic person, makes me envy the kind of guys that just  want casual and allow themselves not to feel anything, how can i be like that?", "time_ago": "16 months ago", "label": 0, "model_prob": 0.0172}, {"bag_id": 14, "orig_id": 46, "text": "Is this basically how dating is these days? \nIt's weird. I've been on a date with this lady in London. I'm 31M She us 28F. \n\nShe was gorgeous, and when I met her, I was literally shocked by how gorgeous she was. We messaged a lot before the date. We have a lot in common. She wanted to taste my food. On the app, she does like physical touch. I did hold her hand, hugged, but did not kiss. \n\nWe went for a coffee and then golf. She mentioned that I was good-looking and that it was a great date. \n\nShe gave me her number after. \n\nI got home ( I stayed the night) day after - 1.5 hours drive. I get the rejection text. There was no chemistry from her. \n\nI respectively texted back with good luck. \n\nI'm not sure what I did tbh.\n\nFunny enough, nearly all the ladies who I rejected or rejected me are still single, and a lot have been dating for over 3 years. \n\nI might have messed this date up and a fe...", "     }
  }
  return shuffled(BAG).slice(0, n);
}

/* Build N_QUESTIONS pairs from 2*N_QUESTIONS checked-out posts, pairing
   them off two at a time and randomizing left/right per pair. */
function buildQuestionSet(posts){
  const qs = [];
  for (let i = 0; i + 1 < posts.length; i += 2){
    const p1 = posts[i], p2 = posts[i + 1];
    const flip = Math.random() < 0.5;
    const a = flip ? p2 : p1;
    const b = flip ? p1 : p2;
    qs.push({
      bagIdLeft:  a.bag_id,
      bagIdRight: b.bag_id,
      left:       a.text,
      right:      b.text,
      leftTime:   a.time_ago,
      rightTime:  b.time_ago,
      labelLeft:  a.label,   // kept for your later analysis only, never shown
      labelRight: b.label,
    });
  }
  return qs;
}

let questionSet = [];
const responses = [];
let current = 0;
let questionStartTime = null;

/* ============================================================
   Logging
   ============================================================ */
function logResponse(entry){
  responses.push(entry);
  if (!CONFIG.APPS_SCRIPT_URL) return;

  const payload = JSON.stringify(entry);

  // sendBeacon fires the request in the background without blocking the UI,
  // and is specifically designed to still deliver even if the page navigates
  // away right after — much better fit here than awaiting a fetch, since
  // Apps Script itself commonly takes 1-3s per call and we don't want the
  // participant staring at "Saving..." for that whole round trip.
  if (navigator.sendBeacon){
    const blob = new Blob([payload], { type: 'text/plain;charset=utf-8' });
    const ok = navigator.sendBeacon(CONFIG.APPS_SCRIPT_URL, blob);
    if (ok) return;
    // fall through to fetch if the beacon couldn't be queued (e.g. payload too large)
  }

  fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: payload,
    keepalive: true, // lets the request outlive a page navigation, similar spirit to sendBeacon
  }).catch(() => { /* best-effort; keep going even if logging fails */ });
}

function renderIntro(){
  app.innerHTML = `
    <header>
      <div class="brand">Reading Task</div>
    </header>
    <div class="panel">
      <h1>Which one is getting married?</h1>
      <p>You'll see ${CONFIG.N_QUESTIONS} pairs of short posts written by different Reddit users,

               border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);"

    if (!val){
      error.textContent = 'Please enter your participant ID before starting.';
      input.focus();
      return;

    PARTICIPANT_ID = val;
    startBtn.disabled = true;
    startBtn.textContent = 'Loading…';
    error.textContent = '';
    try {
      const posts = await checkoutFromBag(CONFIG.N_QUESTIONS * 2);
      if (posts.length < 2){
        error.textContent = 'Could not load posts right now. Please try again in a moment.';

        startBtn.textContent = 'Start';
        return;
      }
      questionSet = buildQuestionSet(posts);
      current = 0;
      renderQuestion();
    } catch (err){

      startBtn.disabled = false;
      startBtn.textContent = 'Start';

function renderProgress(){
  const segs = Array.from({length: CONFIG.N_QUESTIONS}, (_, i) => {
    const cls = i < current ? 'done' : (i === current ? 'current' : '');
    return `<div class="progress-seg ${cls}"></div>`;
  }).join('');
  return `
    <div class="progress-track">${segs}</div>
    <div class="progress-label">Question ${current + 1} of ${CONFIG.N_QUESTIONS}</div>
  `;
}

function renderQuestion(){
  if (current >= questionSet.length){
    return renderEnd();
  }
  const q = questionSet[current];
  questionStartTime = performance.now();

  app.innerHTML = `
    <header>
      <div class="brand">Reading Task</div>
      ${renderProgress()}
    </header>
    <div class="question">Which person is more likely to be getting married today?</div>
    <div class="subtext">Read what each person wrote and when they wrote it, then choose.</div>
    <div class="cards">
      <div class="card" data-side="left">
        <div class="card-label">Person A &middot; <span class="card-time"></span></div>
        <div class="card-text"></div>
      </div>
      <div class="card" data-side="right">
        <div class="card-label">Person B &middot; <span class="card-time"></span></div>
        <div class="card-text"></div>
      </div>
    </div>
    <div class="status-row" id="status-row"></div>
  `;
  // set text via textContent to avoid any HTML-injection concerns from post text
  app.querySelector('[data-side="left"] .card-text').textContent = q.left;
  app.querySelector('[data-side="right"] .card-text').textContent = q.right;
  app.querySelector('[data-side="left"] .card-time').textContent = `written ${q.leftTime}`;
  app.querySelector('[data-side="right"] .card-time').textContent = `written ${q.rightTime}`;

  const cards = app.querySelectorAll('.card');
  cards.forEach(card => {
    card.addEventListener('click', () => handleChoice(card.dataset.side, cards));
  });
}

function handleChoice(side, cards){
  cards.forEach(c => {
    c.classList.toggle('selected', c.dataset.side === side);
    c.classList.toggle('dimmed', c.dataset.side !== side);
  });
  const q = questionSet[current];
  const rtMs = Math.round(performance.now() - questionStartTime);
  const chosenBagId = side === 'left' ? q.bagIdLeft : q.bagIdRight;
  const chosenLabel  = side === 'left' ? q.labelLeft : q.labelRight;

  const entry = {
    participant_id: PARTICIPANT_ID,
    study_id: STUDY_ID,
    session_id: SESSION_ID,
    bag_id_left: q.bagIdLeft,
    bag_id_right: q.bagIdRight,
    question_index: current,
    chosen_side: side,
    chosen_bag_id: chosenBagId,
    chosen_label: chosenLabel,
    reaction_time_ms: rtMs,
    timestamp: new Date().toISOString(),
  };

  const isLast = current === questionSet.length - 1;
  logResponse(entry); // fires in the background, doesn't block the UI
  setTimeout(() => {
    current += 1;
    renderQuestion();
  }, isLast ? 120 : 60);
}

}
