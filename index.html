<style>
  :root{
    --paper:#eef1ec;

    --accent:#3f6357;

    --gold:#b98a3e;

  *{box-sizing:border-box;}
  html,body{

    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:32px 16px 56px;
  }
  .wrap{ width:100%; max-width:760px; }

  /* ---- header / progress ---- */
  header{ margin-bottom:28px; }
  .brand{
    font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:14px; text-align:center;
  }
  .progress-track{
    display:flex; gap:4px; width:100%;
  }
  .progress-seg{
    flex:1; height:4px; border-radius:2px; background:var(--line);
    transition:background .25s ease;
  }
  .progress-seg.done{ background:var(--accent); }
  .progress-seg.current{ background:var(--gold); }
  .progress-label{
    margin-top:10px; font-size:13px; color:var(--ink-soft); text-align:center;
  }

  /* ---- question ---- */
  .question{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:22px; line-height:1.4; text-align:center;
    margin:8px 0 26px; color:var(--ink);
  }
  .subtext{
    text-align:center; font-size:14px; color:var(--ink-soft); margin-bottom:30px;
  }

  /* ---- cards ---- */
  .cards{
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  @media (max-width:640px){
    .cards{ grid-template-columns:1fr; }
  }
  .card{
    background:var(--paper-raised);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    text-align:left;
    cursor:pointer;
    display:flex; flex-direction:column;
    transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .card:hover{
    border-color:var(--accent);
    box-shadow:0 2px 14px rgba(63,99,87,0.12);
  }
  .card:active{ transform:scale(0.995); }
  .card.selected{
    border-color:var(--gold);
    background:var(--accent-soft);
    box-shadow:0 2px 14px rgba(185,138,62,0.18);
  }
  .card.dimmed{
    opacity:.45; cursor:default; pointer-events:none;
  }
  .card-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:12px;
  }
  .card-text{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:16px; line-height:1.55; color:var(--ink);
    white-space:pre-wrap;
  }

  /* ---- footer controls ---- */
  .status-row{
    margin-top:24px; min-height:22px; text-align:center;
    font-size:13px; color:var(--ink-soft);
  }

  /* ---- intro / consent screen ---- */
  .panel{
    background:var(--paper-raised); border:1.5px solid var(--line);
    border-radius:var(--radius); padding:32px 28px;
  }
  .panel h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:26px; margin:0 0 14px;
  }
  .panel p{ line-height:1.6; color:var(--ink); font-size:15px; }
  .panel ul{ line-height:1.7; color:var(--ink); font-size:15px; padding-left:20px; }
  .btn{
    display:inline-block; margin-top:18px;
    background:var(--accent); color:#fff; border:none;
    padding:13px 26px; border-radius:999px;
    font-size:15px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{ background:#345349; }
  .btn:disabled{ background:var(--line); cursor:default; }

  /* ---- end screen ---- */
  .end-icon{
    width:44px; height:44px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex;
    align-items:center; justify-content:center; font-size:22px;
    margin:0 auto 18px;
  }
  .fine-print{ font-size:12px; color:var(--ink-soft); margin-top:22px; line-height:1.6; }
</style>

ast. He\u2019s a great guy, I trust her, they talk on the phone every 2 weeks or so and he\u2019s involved in the wedding. \n\nI know you have trust issues and I respect that, but asking him to distance himself from his best friend just because she is a girl isn\u2019t helpful. Have you tried to become friends with her too? Because that would help with your trust instead of pushing her away. Then he will feel like he can\u2019t ever speak to her in case he upsets you. If you haven\u2019t tried then that\u2019s the issue. Tell us more, what\u2019s the story?", "b": "Haha! Thanks! I needed that :)"}, {"id": "dating_314", "a": "Why would I be resisting?", "b": "I have been called boring my entire life"}, {"id": "dating_559", "a": "Hi. Tall woman here\u2026I would disagree with your statement saying that \u2018the truth is that ALL tall woman are insecure about their height\u2019. That is a generalization that is entirely wrong. And to think that we project that insecurity on to men is again, wrong. I\u2019d be more more chill if dudes didn\u2019t make assumptions about the female race.", "b": "Yes you would be correct.\nI got my braces off 12+ years ago\u2026they definitely have gone down in price. So my apologies for my outdated information."}, {"id": "dating_1334", "a": "They just flip a switch, like all that time you spent together means absolutely nothing. It\u2019s a horrible feeling.", "b": "I mean, I straight up said I don\u2019t want either of us to see anyone else and got a wishy-washy answer that I shouldn\u2019t be worried about it? I don\u2019t really know how to take that. I feel like I was straightforward but can\u2019t get him to be straightforward back. I\u2019m definitely not looking to be committed in a \u201clooking for marriage or kids\u201d way or anything close to that. I don\u2019t want to change our dynamic. I just want exclusivity because I don\u2019t want him to end up tossing me aside for someone else or share him tbh. I explained that and he e actual fuck  \n\n\nI'm a nice guy != \"that woman (who I've never met and know essentially nothing about) should be sent to hell to burn in oblivion\"", "b": "Isn\u2019t it something to do with single men have a habit of not going to a doctor whereas married men eventually get forced to go?"}, {"id": "dating_711", "a": "I got divorced over a year ago and I never did online dating to I think that is where I am slacking because it's so new I just need advice and help getting the profile seen", "b": "I'm 48,  that is how I met everyone before the online thing, and I am so far behind on how online dating works. but yes a guy will buy you a dink and talk to you if he is interested."}, {"id": "dating_82", "a": "I\u2019m a WLW. I love heavier girls. My biggest crushes growing up were all big. I find the softness of someone who\u2019s \u201cfat\u201d to be very feminine. I\u2019ve dated people all over the weight spectrum. As long as you take care of yourself, it\u2019s not gonna scare me away.", "b": "As a queer Jewish woman, I couldn\u2019t be in love with someone who believes in taking away a woman\u2019s right to choose, or supports mass deportations, or is against trans rights.\n\nPeople\u2019s morals are generally very important in a relationship."}, {"id": "dating_335", "a": "I agree that I sound like a jerk. I feel like complete shit.", "b": "Is Online Dating Really This Hard or am I Just Not as Attractive as I Think I am? Hope this doesn\u2019t come across as douchey as it feels to type.\n\nI\u2019m a 27 year old male. Recently single after a super long term relationship (ouch). \n\nI was honestly really excited to try online dating. I\u2019m not a shredded gym bro but otherwise I\u2019m confident that I\u2019m an attractive guy, and I have pretty quality pictures. I honestly thought my hinge profile was going to get ate up. \n\nI\u2019ve been on hinge heavily for like 6 months. And I pay for unlimited swipes so I thought my chances were maximized.\n\nI rarely ever get matches with women I\u2019m attracted to. When I do, I almost never get a response after attempting conversation. It\u2019s honestly been a huge ego hit. \n\nAgain, I\u2019ve been out of the dating game for a long t..."}, {"id": "dating_1301", "a": "This, *BUT* still have the feature of swiping & then matches go on blind dates. You won\u2019t know which one until the end, but at least you both found each other attractive.", "b": "All I have to say is the vile sting that accompanies the loss of a loved one NEVER lightens up and it never goes away. I was driving to school at 8:15 AM once and started just sobbing about my little sister who died almost two years ago. There was no trigger it just happened. Have some grace on yourself because people say the last stage of grief is acceptance but that stage just doesn\u2019t exist. If you\u2019re not ready to move on then give yourself the grace to cry and be sad for however long. If you really want love again, just throw yourself out there. Go to bars, social events, ask friends for connections, or even download a dating app. You may also find you\u2019re not ready to commit because of your trauma and in that case just have some flings. It can be empowering once you realize that you are..."}, {"id": "dating_1184", "a": "nah. i tried this recently and just felt disgusted", "b": "my boyfriend and i hang out 1-2x a week, we both have demanding jobs, so it works for us. as an introvert, sometimes it\u2019s nice to get time to ourselves, but if it\u2019s bothering you remember communication is key!"}, {"id": "dating_1361", "a": "Doesn't have to be platonic but it also doesn't have to be immediately physical either!  \nIf you want to you can suggest going slower than usual with your future partner, mention that goal to your psychs, see what you would prefer or find less stressful/more calming", "b": "M28, as a guy with terrible confidence, the matching (ie you only talk if you both agree to talk) is a great idea.   \nI never met with anyone before 2022, now I meet lovely women maybe once every 2/3 months. It's low intensity, meeting in public places, forces you to meet and get along with strangers. For me it's been a terrific experience and boosted my self-worth.  \nNow 2nd dates is a whole different thing, but that's a me issue not a dating issue."}, {"id": "dating_27", "a": "And you would be correct.", "b": "I feel that so hard.\n\nYou would think that it would make it easier for the good men to find a decent woman but apparently most decent women have already been removed from the apps for one reason or another."}, {"id": "dating_712", "a": "The issue is if they make eye contact with me I don't assume they also find me attractive. I assume they just caught me looking at them and I immediately put my head down.", "b": "No, no, no, and yes.\n\nI'm in graduate school so both have no time and no money. Sometimes all I want is to snuggle and watch movies with a significant other, but that isn't an option right now"}, {"id": "dating_290", "a": "Need dating advice  So l been dating this girl for 10 months and when we first started talking she had this boy bsf and he would always flirt with her and she would brush it off.\nBut I had seen a couple of their messages and he has tried to get with her couple times and she friend zone him but long story short I made her cut him off and that was the end of the story but around February he scheduled a hair appt with her (my gf is a part time hairdresser) I had came over her house while she was doing his hair it was professional... But a couple months later i ended up coming over while she was doing his hair (she did his hair a different time previously but I wasn't there) they were very friendly and it seem like they where friends and it really bothered me l talked to her and she denied it ...", "b": "We love shape and curves\u2026 but it don\u2019t matter for most guys. My gf worry\u2019s abt having a small butt and titties but it\u2019s really ing too late means you are already invested by the time you find out."}, {"id": "dating_643", "a": "I don't think they're annoyed by them sharing, but the OP is coming across as an annoying person in general based on his responses. Like someone who is constantly choosing to be miserable because they're ignoring all advice etc. This post, his comments, and post history is very telling what kind of person OP is. He needs help.", "b": "It'll help because your approach and mindset on it can change for the better. If not help you get one, it'll certainly help you KEEP a girlfriend, because even if you did get one, you've raised so many red flags that tells me you wouldn't be able to have a healthy relationship."}, {"id": "dating_1360", "a": "That sucks. Don\u2019t get attached if you choose to keep seeing him.", "b": "Yeah, I might reach out just so I have my answer. Thanks for the help."}, {"id": "dating_694", "a": "I think she\u2019s showing clear signs of interest, I\u2019d like to think- plus you two would sound cute together? Just play some badminton, I mean- you all seem like you\u2019d be great- you\u2019re just overthinking it big boss.   \nwishing you well!", "b": "Go for it- there\u2019s still time!!!"}, {"id": "dating_1368", "a": "My ex husband said that sex feels like a chore, it was pretty devastating. Thanks for sharing your perspective!", "b": "I\u2019ll take a look, thanks!"}, {"id": "dating_713", "a": "Could  he's lowkey from a famous family. A lot of his siblings are influencers so I could totally screw them all over if I wanted to. Also he told me all their family drama and sent me pictures of some of his nephews that are not public", "b": "He shared his live location, met my family, then ghosted me \u2014 but I still have his location The guy I was talking to shared his live location with me before we even met in person. When we finally met, we spent a whole weekend together \u2014 he even wanted to meet my family and put in a ton of effort.\n\nWe kep ith the part about letting go of shame as well", "b": "? It's not for me"}, {"id": "dating_719", "a": "That's the opposite of my problem actually. I'm not enjoying his attention. I enjoy who he is as a person, I respect him deeply and every aspect of our relationship except for bedroom related stuff. \nI love being single and was single for the most of my life and wasn't planning on getting into relationships anymore. But we started talking and then he confessed that he loves me and wants to be with me. \nHe kinda knows about my asexual tendencies. He just doesn't know the extent", "b": "Thanks I forgot that woodworking exists! That's such a nice activity to do, creative and useful, right up my alley!"}, {"id": "dating_481", "a": "\ud83e\udd79\ud83e\udd79\ud83e\udd79\ud83e\udd79\ud83e\udd79 this just warmed the fuck out of the icebox that replaced my heart", "b": "Can\u2019t speak for majority. The plan is to find one person to share a life with but having consistent friends who are up for closeness and intimacy is nice also. I do meet people who I can see myself sharing a life with but of course i can only make the decision for myself."}, {"id": "dating_867", "a": "I (f25) feel like something is missing in my relationship with my boyfriend (m27) of almost 2 \u00bd years. I\u2019m looking for advice on those with long term relationships, my boyfriend and I have been together almost 2 \u00bd years and it\u2019s been a good relationship, safe, doesn\u2019t feel toxic. But I feel like something is missing like a spark or something, we do the same things each day and seem to have the same conversations (how was your day, what does tomorrow look like for you) and I\u2019m starting to feel like maybe it isn\u2019t the right relationship.\n\nWe\u2019re comfortable together and get along with one another\u2019s families, but I just don\u2019t know if I feel that \u201cin love\u201d thirst with him. Maybe I am just not feeling as desirable and sought after, but also I feel like maybe it feels like he used to put more eff...", "b": "How long has your throat been sore?"}, {"id": "dating_1265", "a": "This is M25. I just told him that I loved him, and I was the one to say it first. This man is probably the only one that I have ever loved, and I\u2019m so grateful for him. \n\nPS: we said it at my favorite Mexican restaurant in town.", "b": "i won\u2019t date anyone who doesn\u2019t have a degree. i know degrees are hit or miss but i want someone who went through the struggles of college and has ambitions for themselves. i know a degree doesn\u2019t make you better than but i do want someone who has a degree since all of my friends are college grads i would feel weird if my s/o didn\u2019t have one."}, {"id": "dating_1264", "a": "im in almost the same situation like you xd but she was the one to end things because she cant commit because of her mental state (goes to therapy, takes medicine for depression)", "b": "yeah ive been doing 1 month no contact"}, {"id": "dating_188", "a": "I thought it was clear enough from the beginning. If I wasn\u2019t interested in, I wouldn\u2019t have asked him out. So I thought he knew my interest and could easily pick it up from there", "b": "Sure, ghosting isn\u2019t gender specific. But since I date men, I only want men\u2019s perspectives. Talking about women ghosting is off topic for my question"}, {"id": "dating_1010", "a": "\ud83d\udc95 I suppose it just is what it is for now. Thanks!", "b": "How to be taken seriously I could list off a million theories as to why I am undateable or why I don\u2019t get approached. However if I truly had to boil it down to something in particular, and highly sarcastic and also naturally playful. I\u2019ve tried dating in person, online, and I feel I can\u2019t successfully come across as alluring or mysterious as I immediately start my typical banter I do with everyone I interact with. Am I coming across as easy? Or aloof? I haven\u2019t been with anyone in years and I wish I could blame my appearance but I am not abhorrent. How do I need to portray myself for potential dating partners to take me seriously."}, {"id": "dating_997", "a": "He literally just signed a new year long lease with her\u2026make it make sense", "b": "But to equate getting laid as a plus for a woman as it would be to a man is misinformed. A woman would rather get a text back or more dates with a man she has not slept with, rather than sleep with him and not hear from him ever again. So to say \"at least she got laid\" kind of misses the point here. I think it's more accurate to say that people who are considered unattractive by the opposite sex aren't successful in their end goals, typically, with attractive members of that group."}, {"id": "dating_535", "a": "He doesn't call me cute. \nSo I've been talking to this guy for almost 7 months. We met online, things got romantic pretty quickly, and we've spent a lot of time talking through texts, calls, and video calls.\n\nToday he was doing something goofy and I called him cute. He thanked me for the compliment, and I randomly went, \"You never call me cute.\"\n\nAnd then I realized... he kind of doesn't?\n\nIt's not that he's never said he likes me. He has. He's told me he finds me attractive too. But he almost never just randomly calls me cute, pretty, beautiful, hot, etc.\n\nIf I actually sat down and counted, I could probably remember every appearance-related compliment he's given me in the last 7 months, and I don't think it'd even reach 15. Meanwhile, I call him cute/hot/handsome all the time.\n\nWhen I po...", "b": "Okay there are questions. Is he looking for jobs eagerly? Is he in school or studying for a degree? Is he working? If yes the Does he work upto is full potential? If yes then Is he responsible with money? If any of these questions have a answer no then I can't date him. He's an adult and he should know how to manage money and still enjoy life."}, {"id": "dating_437", "a": "Usually in 30s. We\u2019re all slowly dying I guess \ud83e\udee0", "b": "A guys about to come is honestly my trigger point :9"}, {"id": "dating_1271", "a": "Personally, I\u2019m not attracted to tattoos and facial hair.\n\nAlso, if I can tell you don\u2019t floss.", "b": "For me, it\u2019s no tattoos"}, {"id": "dating_1216", "a": "Don\u2019t beat yourself up - we\u2019ve all been there/got the dress/bought AND tried out the makeup/psyched ourselves up in our heads. I\u2019m sorry he was a jerk. It\u2019s 100% understandable that you would think that he wanted to take you out on a date\u2026 when he asked you\u2026 on a date\u2026 It\u2019s the way it should, and usually works, with good people. Sorry you came across a shitty one -  you are a good person and he doesn\u2019t deserve you!", "b": "https://vm.tiktok.com/ZM8N53rKG/ \ud83e\udd37\ud83c\udffb\u200d\u2640\ufe0f\ud83e\udd72"}, {"id": "dating_1352", "a": "I used to hate it when people (friends, random guys) asked me what my body count was. I thought it was audacity to ask that question knowing damn well they weren\u2019t gunna raise the number.\nThe only person I would have ever allowed to ask me is my now-fianc\u00e9. Ironically, he\u2019s the one that told me he doesn\u2019t want to know. We\u2019ve both had our pasts and we\u2019ve learned our lessons and those experiences are what brought us together.", "b": "I found out today that I have HSV2 and cannot for the life of me comes to terms with it or accept it. I\u2019ve either been crying or just stare into space.\n\nSo I am also curious with the responses for this post."}, {"id": "dating_149", "a": "My boyfriend\u2019s strict family is affecting our relationship and I don\u2019t know what to do I (25F) has been with my bf (26M) for almost 2 years now. I love him a lot. He is a great person, people around me love him too. Although we have lots of differences, but somehow we still can work it out even though sometimes it is difficult. With this, one main problem I have is that he came from a really strict family. He still has curfew, his parents will call him almost every hours. At the beginning of the relationship, i thought things will be better, because he always try to reassure me by saying \u201cmy family is like this because they haven\u2019t know you yet\u201d. However, looking back now, things are still the same. The fact we\u2019ve known each other for almost 2 years, i join his family trips, but I feel lik...", "b": "Exactly! Thank you! I dont understand either. At first he insists that it will be impossible for me to rebuild his trust but then couple days later, he asked me if I want to rebuild his trust, I didn\u2019t answer him because something doesnt add up. So a week later i asked him why do he change his mind? He said \u201ci\u2019m not ready to give u the answer now because I dont know how things gonna work out\u201d and that answer really bothers me. And right now he ask for a break."}, {"id": "dating_1091", "a": "seriously. reading \"you might not be straight if a mans natural hormonal response is triggering your negative emotions.\" wasn't the support i was hoping for so i just deleted the post. just goes to show what i was talking about, doesnt it?", "b": "No, I\u2019ve had a control freak ex who would literally look through my search history to mock me. That\u2019s why I will never allow anyone to look through my phone again"}, {"id": "dating_700", "a": "I did that like 2 hours and never got a response :/", "b": "Have any girls here been hit on by random guys at a bar and had to use the \"pretend this other guy is my brother/boyfriend\" trick to get them to back off? How did that go?"}, {"id": "dating_167", "a": "There\u2019s a difference between bringing it up when it makes sense with a partner (healthy) and trauma dumping on someone during a first date (which is what I was referring to).", "b": "For me, it totally depends on the other person. Some people I\u2019m fine doing the casual or fwb thing, other people I feel a deeper connection and want to pursue a relationship"}, {"id": "dating_425", "a": "Mid 20s is fine bro. They are generally more mature, but beware of crazy eyes. They will ruin your life. Just don't be like Leonardo.", "b": "Unfortunately, I live outside the major city center. If  I had chose to live closer, I would have no issues getting dates. But alas, I didn't know."}, {"id": "dating_1227", "a": "If you arrange to meet at 19.00, and he leaves at 17.00, he'll be at your place in time. What's the problem? :-)", "b": "Sure, thanks for commenting."}, {"id": "dating_515", "a": "Ah okay, got it. Thanks", "b": "Just as a short reply - I am able to be vulnerable and transparent when I feel there is no risk. When there is a potential partner in the mix, I\u2019m on the surface, \u201ctalking\u201d about my trauma instead of getting real with how it has made me feel or what I am desiring from my connection with the other person. I am always quite passive and don\u2019t know how to engage in the dance of vulnerability."}, {"id": "dating_370", "a": "Ladies what do you actually look for in a man when it comes to dating? Hey everyone,\n\n&#x200B;\n\n&#x200B;\n\n&#x200B;\n\nI'm looking for some honest advice, especially from women who have a bit more life and dating experience.\n\n&#x200B;\n\nI'm 23, around 6'1\", reasonably good-looking, fair, respectful, and I'd like to think I'm pretty funny and easy to talk to. I don't have trouble making friends, including female friends. In fact, that's kind of the problem.\n\n&#x200B;\n\nI've never really had a proper date or relationship. Almost every interaction eventually ends up in the friendship category. I'm grateful for the friendships, but after a while it makes me wonder if I'm missing something when it comes to dating.\n\n&#x200B;\n\nThe more I think about it, the more I feel my biggest issue might be that I...", "b": "Thank you so much"}, {"id": "dating_1007", "a": "So, I'm a guy, and while I feel that the playing field for me and for you are difficult to compare, I will do my best to give the advice I have given myself. Firstly, the fact that your boyfriend has found someone and \"moved on\" doesn't necessarily mean that. But, that shouldn't be your focus, nor should it be a contest. It's not about who moves on first, it's about how you move forward and adapt. \n\nIt makes perfect sense that you were envisioning a lot of future things with him and it is difficult to accept that temporarily it is not easy envision. But, again that is normal since there isn't really someone to take the place as far as I know so your brain is instead trying to rationalize all that which is difficult. \n\nI think the thing you mentioned which caught my attention is the point o...", "b": "Something to build on this that I heard and stuck with was:\n\n\"You actually don't plan to meet the love of your life; you meet the love of your life when you're doing things you love because that's when you're at your most attractive.\""}, {"id": "dating_1249", "a": "I mean I would say women have less bc guys can be less particular. But I think there\u2019s layers of how far you let their attraction go. \n\nNot like you\u2019re allowing it, but like if they clearly aren\u2019t your type, you naturally will put a stop to it sooner\u2026 so if they are getting all the way through to dating, then that\u2019s all self driven.", "b": "I tend to believe we attract what energy we put off. \n\nThat sounds harsh, but what I mean is start by looking at what sort of vibe you put off\u2026 bc those that show interest in us are often a solid barometer for how the world as a whole see us. \n\nTry to look at yourself from the outside."}, {"id": "dating_1057", "a": "You\u2019re not monogamous", "b": "Okay thanks for the advice"}, {"id": "dating_449", "a": "Nurse here, the majority of snoring is caused by a condition called obstructive sleep apnea (OSA). Can also be caused by anatomy issues like deviated septum, large tonsils, long soft palate, etc. But that's why snoring is a TOTALLY valid dealbreaker. Because it's almost always the result of an untreated medical condition. (Though I understand not everyone has access to medical care).\n\nI would recommending seeing a pulmonologist (or an ENT if you think the issue is anatomical) and they can do a sleep test from your house! Usually treatment is a CPAP machine, but for mild cases they can give you special mouth retainers that help keep your airway open at night.", "b": "Yeah do that! The receptionist will live for the tea and if she thinks this nurse is interested, the receptionist will be your wingman.\n\nI fully expect an update later!"}, {"id": "dating_6", "a": "Not at all, and it\u2019s a great point!", "b": "Can confirm, it\u2019s true"}, {"id": "dating_263", "a": "Every girl is different but honestly, my life is so full and busy from doing a corporate job. We\u2019re talking about doing 12-18 hour days every day during the weekday, where I\u2019d typically be having dinner at my desk, in front of a laptop. As such, weekends are really precious to me (noting that I still have to do ad hoc work on the weekends sometimes as well). So I don\u2019t really want to waste time meeting a random guy I have just swiped right on unless we\u2019ve spoken enough to guarantee that the in-person vibe is going to be good and enjoyable.", "b": "To date or stay friends? My friend, Alex (fake name) [27M] and myself [25F] have been friends for almost a decade. We became friends cuz we shared a mutual best friend. For context, he lives in the UK, and I live in Asia, but he recently came back home to Asia to visit.\n\nBoth of us having been shopping around the dating scene for over a year but haven\u2019t found the right person yet. But after a mutual friend said this week that she wondered why I\u2019m not dating Alex cuz we shared really good chemistry, I said that I just never gave it serious thought since he lived in the UK, although the thought had crossed my mind. Our friend then encouraged me to tell Alex and I did that. Turns out, he was of the same mind\u2026so we do like each other and would definitely date if we were in the same city. I lik..."}, {"id": "dating_416", "a": "Racism would be my guess.", "b": "A dealbreaker for sure tbh."}, {"id": "dating_463", "a": "In my experience, men do this petty correcting thing way too much. She was probably already having a BS day and when you corrected her about the clock thing and then made up some elaborate literal clock tower excuse, you didn\u2019t do yourself any favors. Any woman can empathize with the experience of men (even ones they love and know well) mindlessly correcting them in an attempt to further conversation. Some days it is exceptionally grating and becomes the cherry on top of a bad mood. Timing of this didn\u2019t work out for you, but I hesitate to say she\u2019s too sensitive or an a-hole. Sounds like she was texting a guy she is casually seeing about a bad shift and instead of you inviting her to vent about it, you corrected her. I think you need to ask yourself why you didn\u2019t want to hear about her s...", "b": "I\u2019m in a similar situation so this is super encouraging to hear. Do you have any other updates? Things still going strong??"}, {"id": "dating_842", "a": "I\u2019m a virgin. I\u2019m not going to have sex if he\u2019s not my boyfriend. He knew that.", "b": "Haha I haven\u2019t been in a first date in a while but it should be fun. It\u2019s a little cute walk in the park date \ud83e\udd2d thanks for the support \ud83e\udef6"}, {"id": "dating_116", "a": "But some people have RSD and the constant rejection stings a lot for some people. Not saying you should do this to all people or all the time, but I think the first few messages would not be the worst thing.", "b": "Jesus fucking Christ. how fucking ableist."}, {"id": "dating_1099", "a": "That\u2019s still crazy if she did do that! Like that\u2019s some committed acting right there then", "b": "I stopped dating. Went through a really hard breakup a year ago and I\u2019m focusing on my own happiness and not looking for external validations. I\u2019m enjoying myself and traveling and doing what I want right now. In the next year I see myself immersing myself in a new career. I Don\u2019t really see myself dating for a couple more years. If it happens it happens but I\u2019m not seeking it and never have used dating apps"}, {"id": "dating_1272", "a": "I would end things to be honest", "b": "Your ages in your profile go from 18,16, to 20? How old are you?"}, {"id": "dating_496", "a": "This is me I fear, lol. I just like being able to hear him when we're in loud places out to eat, but I wouldn't press up against him or anything.", "b": "I'm 4'10 and my guy is 6ft. It doesn't make you shallow to have that preference, but logistically I promise it really doesn't make a difference. Except sometimes you may have to get things off the top shelf for her."}, {"id": "dating_355", "a": "Always trust your gut!", "b": "I instantly swipe left on those, no matter what."}, {"id": "dating_664", "a": "Why isn\u2019t he opening the messages", "b": "My bf has been emotionally cheating"}, {"id": "dating_905", "a": "Cool, thanks. Feel free to message me. Would love to chat.", "b": "Dating With Erectile Dysfunction Hello! I am 22M and I am pretty certain that I am starting to suffer from erectile dysfunction. I am not currently dating anyone but have taken a couple girls to bed recently. No matter how I tried, I just could not get it up! I was so humilated and embarrassed.\n\nI am looking to get some treatment before pursuing a relationship. Guys - how do you handle this? How would I tell her that I have ED? Girls - would it upset you if your partner had ED?\n\nThanks everyone! As a young male this is very upsetting to me and I am looking for any help and advice I can get!"}, {"id": "dating_1023", "a": "You might be taking too much to heart the advice of a vocal minority. I\u2019m 31f and I do find it kind of weird (not a deal breaker) and annoying when men don\u2019t have an ig. It\u2019s not a red flag either way unless there are weird reasons attached to it. The real problem is definitely the likes and who they follow. If you follow and like a bunch of Instagram models (or fitness models but they\u2019re all women with giant butts - we\u2019re on to you, nobody\u2019s fooling anyone here), then that\u2019s the red flag.", "b": "Hey thanks! Happy Wednesday :)"}, {"id": "dating_303", "a": "When he decided he would spend money on his friends, but was very cheap with me. I wanted to see Black Panther in IMAX, but the only time he would see it with me was during Tuesday discount day. While I was working on Friday night, the day it released, he saw the movie with friends in IMAX and tried to hide it from me.", "b": "I'm a Sagittarius, so same element."}, {"id": "dating_1253", "a": "Damn they're paywalling dating now?? I can't imagine spending over $100 to get to know someone. And I can't imagine they have a personality worth the cost if they're demanding you spend more money on them.", "b": "Oh my god. Very helpful, thanks. Love the Daniel Radcliffe cameo lol"}, {"id": "dating_1072", "a": "just tell him in a very nice way and should be fine  -  unless this is the only way he prefers it. though I would say in my experience people I dated for some time were always kissing compatible to me from the beginning", "b": "hold on in there - I do occasionally get decent dates like really (I\u2019m based in London) - a bit of a numbers game though! after a relationship for the first few months dating just felt so shallow so I get what you feel"}, {"id": "dating_998", "a": "You owe it to yourself to be honest", "b": "I didn\u2019t know natural charisma has an expiry date\u2026or that it\u2019s only reserved to work well for young ppl."}, {"id": "dating_921", "a": "Was the outbreak bad? What was your experience like?", "b": "This is what she was telling me as well. I\u2019ve been reading up on it a lot too. It\u2019s really good to hear real life experiences. Thanks for sharing"}, {"id": "dating_319", "a": "Meeting the family  When would yall say is the right time or time frame to introduce a new SO to your parents and family? My new boyfriend and I have only known each other a month and officially together for a week now and he really wants to meet my folks and he wants me to meet his. I like him A LOT and can see it getting serious, I just take meeting my parents very seriously and want to make sure we aren\u2019t moving too fast. But I also don\u2019t want him to think that I don\u2019t want him to meet them because I do. How would you go about this?", "b": "Matched with someone should I continue? So I (30f) matched with this guy (30m) in Florida on hinge. When I matched with him I was already on the fence due to not being as attracted to him based on his pictures. But I chocked it up to maybe he doesn\u2019t take great photos or they could be outdated. We messaged for a couple of weeks and conversation has been fine, no red flags. We finally meet in person for our date and I\u2019m still not getting that physical attraction \u201cspark\u201d that I have had in the past with people I\u2019ve ended up dating. The date was fun, he\u2019s nice,  we had a good time with each other and good conversation. Should I give it more time even if the physical attraction isn\u2019t completely there? Anyone in the app been in the same position and what did you do? \n\nThanks"}, {"id": "dating_97", "a": "Yeah this could definitely mess up some people with the contradiction that was happening. Wishing your heart a well recovery and hope one day you\u2019d be more than okay again \ud83d\ude4f", "b": "I would opt for him to come down to my city instead, ask him to stay in hotel, meet in places I know safe and if everything checks out maybe I\u2019ll spend a night or something"}, {"id": "dating_1033", "a": "Please do not meet someone you\u2019ve never met before in an airport or drive him to his place. Sounds unsafe", "b": "Thank you for your advice, I needed that."}, {"id": "dating_1158", "a": "I don\u2019t have that problem, you\u2019re right. However, failures of dating can lead to you finding someone eventually through the failures. There\u2019s no end to loneliness. Loneliness, just turns into more loneliness.", "b": "It becomes a big problem if you can\u2019t accept it. That would be way too mentally and emotionally draining for someone."}, {"id": "dating_1126", "a": "especially if it was a connection", "b": "i will for sure"}, {"id": "dating_743", "a": "I really don't think I'll get resentful because everyone says it's gonna be a hard transition for him living with my young kids.if you look at reddit 90% of men say they'd never do something serious with a single mom. It's a big commitment. But if I didn't have him contribute should it be like 25% because he's 25% of the household?", "b": "Again, I'm not looking for a serious relationship, so idk how I'm gonna be building a house. I'm looking for boyfriend for a night once a week experience, where I pay for everything, preferably."}, {"id": "dating_278", "a": "Yes it did !! \n\nI m anxious now .. thinking of the possibility of the relationship being like ma past one scares me .. coz initially everything felt like sunshine and rainbow in ma past relationship too \u2026 and how that could affect me mentally is struck in ma mind .. \nThe moment i start dating smeone or even have a talkin stage with smeone \u2026 my mund automatically goes \u201c get ready to face every bag thing tat comes up way \u201c \nBcoz of which i tend to be an asshole to the other person !", "b": "Thanks ! Trying to !!"}, {"id": "dating_0", "a": "Yes! I also have standards (nothing crazy either) but so many people tell me that I need to lower them. And these are typically the people in an unhappy marriage. \n\nI\u2019m sorry but I would rather be alone and happy with myself instead of acting in a fa\u00e7ade of a relationship.", "b": "So glad I\u2019m not alone in this. I did download Hinge? I don\u2019t know if that\u2019s a good one or not for what I\u2019m looking for but honestly so far so good. I found a few matches and it\u2019s looking good but I\u2019m not getting my hopes up. Thank you!"}, {"id": "dating_161", "a": "Why did he even bother coming to my house", "b": "Younger men would be up for it"}, {"id": "dating_746", "a": "If he had that many drinks and was not obviously drunk, he certainly seems to have a high tolerance which leads one to assume he drinks A LOT. That is not a road you want to travel.", "b": "I dont think it has ever worked for me. \ud83d\ude02"}, {"id": "dating_890", "a": "Not being on Facebook would be an asset in my book. I am on Facebook and it's the biggest regret to have joined.", "b": "No, who is Ethan Slater?"}, {"id": "dating_1290", "a": "We\u2019re exclusively dating each other. I guess this is the part where it\u2019s confusing in modern dating. It\u2019s the relationship period in between dating and marriage that I want. Is that what you call engagement already? Trying to just see new perspective here \ud83e\udd37\ud83c\udffb\u200d\u2640\ufe0f", "b": "I feel you!!! I\u2019m not really the one to play those kind of dating games because culturally, we were taught to value relationships more and it\u2019s hard for me at my first year of dating to just \u201cbe chill\u201d and \u201ckeep your options open\u201d etc, etc.\n\nOne thing I learned (and surprisingly found) is that there are still people who genuinely want to be with you. They hate the dating culture as much as the rest of us, you just have to keep going until you meet someone who appreciates you for who you are and keeps you because they see your worth and they know theirs."}, {"id": "dating_107", "a": "hugs Op. It's Completely understandable. Work on yourself bit by bit maybe start with something like exercise and the gym, just have a destination and starting point", "b": "I am going through that rn and it's heartbreaking"}, {"id": "dating_1162", "a": "We're worried being forward will be a turn off", "b": "Thats called a friendship, it's supposed to go two ways."}, {"id": "dating_1245", "a": "That\u2019s a good point. I feel like I always learn so much from each relationship. About what I want/need and also about myself and how I can be better", "b": "Oh dang\u2026 ok. Thanks for sharing"}, {"id": "dating_901", "a": "That was your favorite?", "b": "-email devs to request refund for subscription\n\n-developers never respond to email"}, {"id": "dating_1321", "a": "I'd honestly try and just apologize and if they want to reschedule at least they see you made the effort and you're not making up an excuse to not see them. It's like a job interview. Show up sick, they might keep things light, but they appreciate you trying", "b": "You're not wrong"}, {"id": "dating_1157", "a": "Just text him? \u201cHey. I know we don\u2019t know each other super well but maybe we can go get coffee. I\u2019ve really enjoyed talking to you\u201d. \n\nCurrently the ball is in your court because he said he liked you and you beat around the bush with your response. He\u2019s 98% likely to say yes given the context of your post.", "b": "Gee, thanks. I hadn\u2019t thought of that before.. I\u2019m not sure I want to date not I don\u2019t want to. I\u2019m just ready to be more picky"}, {"id": "dating_1258", "a": "she might just be a lil insecure, if she doesn\u2019t stop ~3 months after being official (or sooner idk whatever feels right to you) i\u2019d genuinely ask her and say how it makes you feel", "b": "https://www.sane.org/information-stories/facts-and-guides/sane-steps-how-to-help-when-someone-is-suicidal"}, {"id": "dating_213", "a": "Yeah \u2026 nothing I can do until he \u201ccomes back\u201d but who even knows if that is real. Just so frustrating", "b": "Thanks! I wish I could give it a try but there\u2019s no one in my life to even have sex with. Who knows how long that will be for the next \u201ctry\u201d"}, {"id": "dating_976", "a": "Dating while depressed (but medicated)? 25M\n\nI've had clinical depression since 12 years old but thankfully at 21 I finally got medicated which made me able to make some drastic changes in my life and I'm now in an objectively better situation with at least more life experience than one might expect for someone like me.\n\nBut I've come to the conclusion that I have always and will always have: very little motivation. What I mean by that is that I usually have very little intrinsic motivation to do stuff (even though I might still do them), possibly because I just never feel as much joy/happy chemicals from doing the thing as the random person? Therefore, most of the motivation I do have comes from the knowledge that things will be even worse if I don't do certain stuff, and not like 'this t...", "b": "Yeah I have been to a few places. Still feel boring though. It doesn't help that I still have depression so being enthusiastic about anything is hard."}, {"id": "dating_1043", "a": "Also if they \u201cperfectly click\u201d with me then I should be attracted to them. Otherwise it\u2019s not a perfect click.", "b": "Right?! it\u2019s cool that OkCupid had that"}, {"id": "dating_1199", "a": "same \ud83e\udd1a\ud83c\udffb\ud83e\udd1a\ud83c\udffb\n\ndating can be the right answer if you find the right person. then it is heavennn!!", "b": "here for you <33"}, {"id": "dating_614", "a": "Why, though? Why not give someone who hasn't had such a tumultuous track record a chance?", "b": "\ud83d\ude44 sure my guy, sure."}, {"id": "dating_1006", "a": "About two years before we got together. We had a friends with benefits thing going on for a while that fizzled out, started back up again which turned into us hanging out all the time and making it \u2018official\u2019 maybe six months later? Moved in almost immediately and we\u2019ll be about to celebrate 3 years soon - both of our first serious relationship and happy as hell!", "b": "I was casually dating a few other people when I got with my current boyfriend and he continued to date/hookup as well during that time. We kept communication open (we both agreed we didn\u2019t want to know any details pertaining to others) but just naturally wound up spending most of our time together, we\u2019ve been officially together for about a year and a half now. We live in a pretty small town so some of the people we\u2019ve had relations with run our circles but it\u2019s never been an issues because we were honest from the get go. \n\nI think it\u2019s totally normal and it\u2019s actually a pretty good place to be in starting with open transparency, it sets you up for good communication as things progress!"}, {"id": "dating_1243", "a": "Wow that\u2019s almost half your life!", "b": "It\u2019s quality over quantity for me. And I don\u2019t really need to try to be \u2018too good\u2019 for anyone."}, {"id": "dating_1037", "a": "Love is ultimately about sacrifices. Can you sacrifice your wealth to show him the love he deserves? Because if you can\u2019t, that\u2019s on you for some self reflection of what really matters in life. If you really can\u2019t get past money right now, don\u2019t subject this man to your materialism.", "b": "You aren\u2019t a loser because you\u2019ve never had a girlfriend. That is okay, and shouldn\u2019t define you. A \u201closer\u201d is formed by their mentality and lack of hope for themselves. I know how troubling and lonely it can feel, I didn\u2019t have a boyfriend for FOREVER until I finally took the time to focus on myself. I ate better, worked on my hobbies, and started focusing on helping others and counseling myself. It doesn\u2019t have to be huge changes, man. Just small enough stuff that helps you feel better about yourself. Start by buying yourself something nice, like a better cologne or even a good shirt. It doesn\u2019t have to be more than 10 dollars. Make sure you feel good about you. \nNo girl is going to want to date a guy that only ever wallows in self pity and hatred. You could be the hottest guy in the wor..."}, {"id": "dating_565", "a": "I don't think that's the case. He's genuinely tired.", "b": "Hahaha I\u2019ve learned my lesson."}, {"id": "dating_1257", "a": "Probably a good reminder. Nope, I don\u2019t want one.", "b": "Guy I\u2019m seeing says he wants a \u201cbreak from monogamy\u201d? I (27F) have been seeing a guy (36M) I met on a dating app for a couple months. Things have been going pretty great, and it seemed like we connected on a few different levels. However, a few days ago he let me know that he has been doing some self reflecting that led him to be interested in an ENM/polyamory. The way he phrased it made it seem like he has never tried it before, and wasn\u2019t sure where he would end up, but regardless was thinking he wants a break from monogamy altogether.\n\nI let him know that I had previously dated a polyamorous guy, and that it wasn\u2019t for me - so we should probably take some space. He expressed some disappointment but I told him I wasn\u2019t likely to change my mind. Surprisingly, we\u2019ve texted a bit back and f..."}, {"id": "dating_77", "a": "Seems like she might have been interested in more but you dropped the ball with the polyamory question", "b": "Unfortunately you are.\n\nLuckily so is everyone else, (almost), just go find someone whose pieces are broken to match yours or otherwise therapy then date"}, {"id": "dating_795", "a": "Your friend deserves to be kept around. The boyfriend needs to grow up.", "b": "I can only speak for myself, and I do not want a fwb, I want a relationship. But folk keep ghosting \ud83d\ude1e"}, {"id": "dating_818", "a": "She didn\u2019t go into much detail, but the broad strokes were enough to gather that it was.. fairly normal.. There wasn\u2019t a reason to lie.\n\nThat\u2019s entirely possible.. but again, she wasn\u2019t like that with her ex from what I gathered. If she was just a pillow princess, you would think it\u2019d be universal.", "b": "Around 5.5\u201d long."}, {"id": "dating_880", "a": "It sounds like you really need to communicate. It does give some red flags just from your post - insecurity, inconsistency, etc, but also it sounds like you guys haven\u2019t had a productive conversation on what you are. Figure out how you feel and then have a conversation with him. Tell him what you want, ask what he wants, and see if you can come to a conclusion for a path forward. It may be scary because he does seem a little immature in some ways, but you don\u2019t know how he can handle a relationship if you don\u2019t try. He also seems like he has some really great attributes as well and it seems like you like him, so I think it would be disservice to yourself to not try.", "b": "Happy for you! Trying to keep hoping for the right person!"}, {"id": "dating_548", "a": "Why like they might try and take advantage of me or something?", "b": "Yeah but for how long"}, {"id": "dating_930", "a": "Focus on becoming a better person, everyday. Nothing else. Don\u2019t expect anything and it will happen.", "b": "Move on, you\u2019ll find someone who will commit."}, {"id": "dating_567", "a": "Dating Intentions  Met a 31M on CMB in Dec 2023. Till date, we have met 4 times. \n\nBelow are some of my observations. He also remembers details of what we said during dates. Need advice whether this guy is inexperienced in dating, does not have good social skills, lazy and non-committal or just not interested. \n\nThings I observed:\n1) He seems very comfortable with just texting and not meeting up. His texts are always long paragraphs 2-3 times a day\n\n2) I initiated and planned 2 dates (1 karaoke + 1 games night). When he initiated the first and most recent 4th date, he only suggested dinner (expected something more). I suggested karaoke for one of the dates as an impromptu activity after he said he tried to search for events happening but there weren\u2019t any\n \n3) After every date, he would al...", "b": "Behaviour Met someone from dating app at a casual dining restaurant where I reached first and got assigned to a 4-seater at the corner. I placed my shopping bag, water bottle and a long gift wrapper next to the empty side beside me. \n\nWhen he arrived, he sat diagonally opposite me (facing my shopping bags) instead of me. I felt it was weird but he didn\u2019t say anything. Few mins later, I somehow obliged and quietly swapped places so that I can sit opposite him and have a proper conversation. \n\nHe said he\u2019s an introvert (which I am too) but I felt he was dominating the whole conversation and felt somehow intimidated. And he asked why am I so quiet. \n\nWe have many common interests (discovered through text) but none of that came up in our f2f conversations as he was very focused on my social sk..."}, {"id": "dating_55", "a": "That isn't what happened.", "b": "These are first dates. She is not leading anyone on. 99% of first dates go nowhere. No one's fault. Just not compatible. It's really hard to tell from a dating app if you're going to hit it off. Most of the men's profiles I see have a line in there about meeting in-person to figure that out instead of texting for weeks. She's actually following that wish and getting beat up over it. \n\n  \nI'm a big fan of cheap, split the check first dates to get away from the idea that the fella is owed anything for gracing me with his precious time. \n\n  \nI'm bi and don't get this from my lady dates."}, {"id": "dating_1151", "a": "Exactly. That\u2019s why OP should not go!", "b": "Thanks for feeding into my delusions \ud83d\ude02\ud83d\ude02"}, {"id": "dating_756", "a": "Your ex is a dumbass what the fuck. Boobs are boobs. I\u2019ll be honest from the post I was assuming it was going to be a him complaining they\u2019re to small which again boobs are boobs he shouldn\u2019t be complaining \ud83e\udd23. Honestly keep being you and trying most guys won\u2019t be like him. This is wild tho I\u2019ll be 100% if one of my friends ever broke up with a girl and said it was cause her boobs were to big I would probably assume from that point forward he was into dudes.", "b": "Maybe I presented myself differently than I intended cause I didn\u2019t mean love. It\u2019s been two weeks."}, {"id": "dating_1238", "a": "I had a thought he was love bombing or just chasing the dopamine at first but then got bored :/", "b": "As a woman, no. I don\u2019t have the patience to teach a grown man how to be good in bed"}, {"id": "dating_1111", "a": "Did you ever think that the people with you were with were not sharp enough to catch on? Or did you just think you were too careful to have to worry about that.", "b": "I\u2019m really sorry to hear this. It\u2019s so sad and I\u2019m not even going to say that I can anywhere near understand what you are going through. It\u2019s devastating and you need to feel it. Give urself time to grieve for her and eventually begin to step back into life. Pick up a hobby, see a therapist, and move on in life. Never forget her or what you learned from her. I\u2019m so sorry that this happened to you. I truly wish you the best. For now find solace in friends, family, cooking for yourself, maybe spending more time with a pet or getting one if you have the money/time to spare. A therapist can really help you cope with not only her death but also your guilt. The situation uu explained makes it sound like it would be best to talk it out. Take care of yourself and in time things will be better. I h..."}, {"id": "dating_1285", "a": "There\u2019s also how people handle being ill. My boyfriend seeks company when he\u2019s sick, whereas I turn into the wild animal that hides under your porch to die. I love that he trusts me and finds comfort in me when he needs it, but when I\u2019m sick I tell him to just throw bottles of NyQuil at me from the doorway.", "b": "Challenge doesn\u2019t necessarily mean to fight. It will vary by situation, but it could be as simple and small as hearing a friend say a rude joke and saying it isn\u2019t funny. Others have mentioned that learning how to handle conflict is important for a healthy and mature relationship, but it\u2019s important for adulthood in general. Not everything needs to escalate if you have good conflict management skills."}, {"id": "dating_289", "a": "Read their behavior. If they talk to you often or daily and ask to go out regularly the convo should be easy. If they have 3-4 people on the hook it\u2019ll feel crappy because they might not want a serious thing. \n\nBest wording is what are you looking for out of our relationship. Or discuss their feelings about you and then dating others.", "b": "I think true love is real but those butterflies go away after you start loving and trusting them\ud83d\ude05... Don't worry that confidence feels much nicer."}, {"id": "dating_1177", "a": "When did you know to download a dating app? I don\u2019t usually get hit on and recently got out of a relationship and wanted to branch out.   \nI\u2019m a bit embarrassed to go onto a dating app because I\u2019m scared to see people I know LOL but I think going on some dates would be fun ya know? When did you think was the best time to get a dating app? When you got bored? How\u2019d you get over that \u201cseeing people\u201d anxiety if you had it?", "b": "yes!! maybe journaling?..or no is that boring? hahah maybeee like reading? anyway i really hope things go great and you find a FUN hobby haha \ud83c\udf80"}, {"id": "dating_962", "a": "Like, I would have no problem if my partner did that with my information, but I\u2019m also a woman and I understand that doesn\u2019t mean they think I\u2019m going to do anything, just that someone could", "b": "I\u2019m 23. The alternative is to go older, but I\u2019m generally not physically attracted to that, and older men who chase young women generally are predatory and/or bums who can\u2019t get a successful woman their own age."}, {"id": "dating_651", "a": "Light touch on the upper arm when you are laughing at his joke. Hold eye contact just a second longer than normal. Ask him to help you with something. Give a very thoughtful, personal compliment.. eg. Don't say I like your shirt, say I like that shirt on you.", "b": "It's very very true!"}, {"id": "dating_909", "a": "Sorry your experience was so bad, as I explained in another comment the person is fantastic and will be a loss on both sides of the coin but it will be what it will be", "b": "Money no never a thing for myself so I guess who knows"}, {"id": "dating_113", "a": "Well at least I know it\u2019s not just me and I\u2019m not being overly sensitive!\n\nLike I said, not really interested in this being something more and possibly even taking a step back to FWBs. I\u2019m not in a position to pursue a longterm relationship right now and he\u2019s decent company usually. But you\u2019re right, major flags were waving in my face after this.", "b": "Same! My last relationship lasted 5 years. I was an anxious depressed mess as a teen, and then he swoops in and being around him made me not feel terrible all the time. Then, during the last 6 months of our relationship, that feeling wasn\u2019t really happening anymore. There were a lot of life changes happening and we had been LDR for a year. I was spiraling again and the fact that I wasn\u2019t getting the dopamine rush from being around him anymore only made it worse.\n\nHe ended things. And I was anxiously trying to search for something to fill my emptiness. After a particularly intimate night with the current guy I\u2019m seeing, I felt that rush of chemicals again. That feeling of being safe and wanting nothing but to just lie in bed with him forever.\n\nBut after him telling me he\u2019s not wanting a ser..."}, {"id": "dating_1364", "a": "This is the most important thing I learned that I need", "b": "10 dates in one month is a lot, most guys I match with don\u2019t even ask me on a date on dating apps"}, {"id": "dating_207", "a": "I'm glad you decided to do that! Here's hoping there's nothing wrong and its just nervousness!", "b": "\"Adding my own love to my cup\" thats a great way to put it, thanks!!"}, {"id": "dating_488", "a": "I did say that I was mad at myself for being hung up on her.\n\nI feel like crushes kind of are the way of being a little obsessed right? As far as being entitled, that seems like a bit of a jump. I never said she owed me anything and I never demanded anything. \n\nI created an opportunity for her to give me clear clarity one way or the other so I could move on and not expect anything of her and she intentionally gave me an indecisive answer, seeming to intentionally string me on.\n\nThe point of this venting was two-fold. To attempt to help others like me realize the futility of investing emotionally in something that isn't clear and to ask people to not string people along. If you think it was all in my head, then great! I am advising people against doing that as I preach at myself to move on....", "b": "No problem! Glad to help! Good luck to you!"}, {"id": "dating_771", "a": "Yes! My boyfriend and I slept together the first night we met and we\u2019re still going strong nearly 2 years later. I would have never wanted the type of guy who would think I\u2019m \u201cnot girlfriend material\u201d for doing the same thing he did anyway. It takes 2 to tango", "b": "Thanks for the response! I haven\u2019t had therapy, I don\u2019t even know how to go about going, getting an appointment, etc. I\u2019m definitely open to it but it seems like a lot of effort for something that\u2019s not necessarily a high priority to me right now but maybe I need to make it a priority because it really does seem like it\u2019d be helpful for me."}, {"id": "dating_1237", "a": "I think this is what I needed thank you \u2764\ufe0f", "b": "I love the idea but not for a 1st or even 4th date. I would have to know you well enough to know I am for sure safe in the setting."}, {"id": "dating_1275", "a": "If I was the guy, I would laugh probably but it's not something that would make me change my mind about you. If I were into you before the accident, I would be into you after it happened", "b": "yeah, a lot people assume \"I am a reward you should fight for\"\n\nNo, I offer good time, and expect good time. I am looking for a partner, not another chore with no return"}, {"id": "dating_388", "a": "This is exactly why I wouldn\u2019t date someone with a kid. Not because of the responsibility, but because I wanna be his number 1. Idk maybe that\u2019s silly and selfish. And I know you\u2019ll be *A* priority. But you won\u2019t be number 1", "b": "It\u2019s a little unattractive. Also would be weird to put any tv shoe as an interest"}, {"id": "dating_378", "a": "Why go for a relationship when alcohol is a thing? I can't understand why I would go for a relationship when I already have an unhealthy link to drinking.\n\nTakes up most my thoughts,\n\nPrevents me from reaching my full potential,\n\nNeeds me to have private time with it,\n\nLooks pretty at times,\n\nSpreads itself all over your body,\n\nMakes some nights totally wild,\n\nDemolishes your wallet,\n\nAlters my regular train of thought.\n\nI cant see a reason to get into a relationship when booze does all the same things.", "b": "No because that is called lying and lying is bad mmmkay."}, {"id": "dating_737", "a": "It\u2019s tough to close a door when your heart isn\u2019t ready. Don\u2019t be too hard on yourself", "b": "Sending you a lot of respect for how you\u2019re handling this. One day someone\u2019s going to be very lucky to be in your corner."}, {"id": "dating_1145", "a": "I know for me personally I think jealousy would consume me. I would definitely take a deep look into how you would feel. I wouldn\u2019t just do it to make him happy, but if it\u2019s at. I used to be, but depression has ate away at my memory and well being.", "b": "I never asked for advice, I asked for resources."}, {"id": "dating_1078", "a": "Just Reddit abbreviations, I don\u2019t think anyone uses these outside of here", "b": "Not my thing but I\u2019d partake if it gave him oleasure"}, {"id": "dating_357", "a": "You just gotta get picked by somebody at some point. Still working on that if I am honest.", "b": "I am trying to avoid online dating tbh because I hear that its super toxic. But thanks for the advice anyway, maybe I am gonna need it someday."}, {"id": "dating_494", "a": "I guess I don\u2019t get why you would waste your time?", "b": "Not for me personally but then again different strokes for different folks. \n\nMy boyfriend LOVES it\ud83d\ude02\ud83d\ude02"}, {"id": "dating_752", "a": "Luckily we go to school together so I know who he is and I know he's not a stranger\ud83d\ude05 But I agree, I think that shows a lot of trust", "b": "not. body. odor. omfg."}, {"id": "dating_1242", "a": "Yeah I guess I was in a really good place with myself that it all worked out. I also would say I think on paper he is not who I would've thought who I would've ended up with and that it's important to keep an open mind", "b": "100% projecting his own insecurities onto OP, it's not okay to do that"}, {"id": "dating_185", "a": "Thanks buddy. I know, I hope i'm overthinking it and people don't see it as a red flag, but sometimes it seems to be the only answer to why i'm perpetually single. I haven't even kissed someone in nearly 3 years.", "b": "Easier said then done. I\u2019ve been trying to meet women but no luck so far. Hence my post. I can\u2019t seem to get a date.   \nI\u2019m glad to hear that it helped tho."}, {"id": "dating_514", "a": "yes, this is the longest. I think I will also be petty and not reply today at all since it's almost the night time where i live. The problem is that I feel like if I ignore small details at the start I will just have bigger problems in the long run", "b": "How would you know how it feels lile being ignored of you are single?"}, {"id": "dating_267", "a": "Same as I did when I was informed a person I was on a date with was also a virgin at a slightly older age. Taking things at a comfortable pace and not making a huge deal of it helped. Communication prior, and during to make sure that there is no issue with what the other is doing (or not doing) when it comes time to take things a level further.", "b": "Sounds familiar! I refused to touch anyone for a long time after"}, {"id": "dating_358", "a": "At the very most, being flaky just means that she\u2019s not interested but lacks the communication skills to cut things off. You\u2019re suggesting that he then pretends to only want to sleep with to manipulate her into being attracted to him. I can tell you for a fact that if a girl not interested in someone romantically and then they pretend to just want something physical, it is VERY transparent that they are just playing games to protect their ego.\n\nWould that work on you the other way around? If so, I\u2019d take a look at your own insecurities.", "b": "This absolutely does not work and we can see right through it. It recently happened to me - the guy had told me he wanted to be exclusive, and then once I turned him down he then pretended to only be interested in hooking up. It really made me just feel pity for him and remove any attraction I might have had toward him."}, {"id": "dating_1256", "a": "It sucks feeling like a gold fish out of the water in the same water you were born, raised in, and grew up in. I met my match / soul mate and we\u2019re in similar classes and he felt the same. We ended up moving because it was draining dealing with everything that comes with a VHCOL that is popular.", "b": "I\u2019ve never been single longer than 6 months (by choice). I would go on 2-4 dates a week. Gave different types of people a chance. People are just lazy and flakey now and then when their laziness and flakiness prevent them from getting what they want, it\u2019s easier to blame apps or dating. I\u2019m sure there\u2019s some people out there that are just having bad luck but even with friendships I find the quality is going downhill. The comments I see online are evident of people complaining about everything and everyone. I love a good complain sesh myself but if you\u2019re not changing your efforts then nothing will change."}, {"id": "dating_987", "a": "What would you think if you were dating someone who\u2026 What would you think if you were dating someone who enjoyed their alone time, had friends but didn\u2019t always have to be doing something with them and liked being tucked away in their room chilling out? Would you think they had no life or just an introvert?", "b": "I do want kids \ud83d\ude29 I find the irl game harder because I\u2019m not in a position to go out often.."}, {"id": "dating_626", "a": "Why not if it was someone new?", "b": "Will seriously consider. Thanks!!"}, {"id": "dating_837", "a": "Not sure if I would call it entitlement... but definitely just very entrenched in the typical dating roles in modern society. Most women expect men to make a first move because they experience it so much more. Its just normal. But women definitely can and SHOULD express their interest if they like a guy.", "b": "I mean yeah, this is definitely a common trope.... but there are plenty of guys who actually dont care about age as long as its close. Like my range for women I am looking for goes\u00a0the same number of years UP as it goes DOWN. As long as their close to my age im not just looking for younger women. And I bet there are a LOT of men (maybe even greater than 50%) who feel the same."}, {"id": "dating_1318", "a": "Lmao why is it ur friend\u2019s responsibility to help u date? Thats YOUR responsibility. You won\u2019t be ready to date until u become more independent", "b": "Rule #1: Never settle. Ever."}]

   Data + participant params
   ============================================================ */
const PAIRBANK = JSON.parse(document.getElementById('pairbank-data').textContent);

function getParam(name){
  return new URLSearchParams(window.location.search).get(name) || '';
}
const PROLIFIC_PID   = getParam('PROLIFIC_PID');
const STUDY_ID        = getParam('STUDY_ID');
const SESSION_ID      = getParam('SESSION_ID');
const PARTICIPANT_ID  = PROLIFIC_PID || ('anon-' + Math.random().toString(36).slice(2, 10));

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Sample N pairs for this participant, and randomize which side (A/B posX)
   each item's "indicative"/"control" text lands on, without revealing
   that distinction anywhere in the UI. */
const questionSet = shuffled(PAIRBANK).slice(0, CONFIG.N_QUESTIONS).map(pair => {
  const flip = Math.random() < 0.5;
  return {
    pairId: pair.id,
    left:  flip ? pair.b : pair.a,
    right: flip ? pair.a : pair.b,
    leftIsIndicative: !flip, // for later scoring only, never shown to participant
  };
});

const responses = [];
let current = 0;
let questionStartTime = null;

/* ============================================================
   Logging
   ============================================================ */
function logResponse(entry){
  responses.push(entry);
  if (!CONFIG.APPS_SCRIPT_URL) return Promise.resolve();
  return fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors', // Apps Script web apps don't return CORS headers for simple POSTs
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(entry),
  }).catch(() => { /* best-effort; keep going even if a beacon fails */ });
}

/* ============================================================
   Rendering
   ============================================================ */
const app = document.getElementById('app');

function renderIntro(){
  app.innerHTML = `
    <header>
      <div class="brand">Reading Task</div>
    </header>
    <div class="panel">
      <h1>Which post signals it more?</h1>
      <p>You'll see ${CONFIG.N_QUESTIONS} pairs of short posts written by different Reddit users.
      For each pair, pick the post that seems like a <strong>stronger signal</strong> of something
      about to change in that person's life.</p>
      <ul>
        <li>There's no single "correct" answer &mdash; go with your honest first read.</li>
        <li>Posts are shown exactly as written, so spelling and formatting may vary.</li>
        <li>Takes about 3&ndash;4 minutes.</li>
      </ul>
      <button class="btn" id="start-btn">Start</button>
    </div>
  `;
  document.getElementById('start-btn').addEventListener('click', () => {
    current = 0;
    renderQuestion();
  });
}

function renderProgress(){
  const segs = Array.from({length: CONFIG.N_QUESTIONS}, (_, i) => {
    const cls = i < current ? 'done' : (i === current ? 'current' : '');
    return `<div class="progress-seg ${cls}"></div>`;
  }).join('');
  return `
    <div class="progress-track">${segs}</div>
    <div class="progress-label">Question ${current + 1} of ${CONFIG.N_QUESTIONS}</div>
  `;
}

function renderQuestion(){
  if (current >= questionSet.length){
    return renderEnd();
  }
  const q = questionSet[current];
  questionStartTime = performance.now();

  app.innerHTML = `
    <header>
      <div class="brand">Reading Task</div>
      ${renderProgress()}
    </header>
    <div class="question">Which post reads as a stronger signal of what's coming?</div>
    <div class="cards">
      <div class="card" data-side="left">
        <div class="card-label">Post A</div>
        <div class="card-text"></div>
      </div>
      <div class="card" data-side="right">
        <div class="card-label">Post B</div>
        <div class="card-text"></div>
      </div>
    </div>
    <div class="status-row" id="status-row"></div>
  `;
  // set text via textContent to avoid any HTML-injection concerns from post text
  app.querySelector('[data-side="left"] .card-text').textContent = q.left;
  app.querySelector('[data-side="right"] .card-text').textContent = q.right;

  const cards = app.querySelectorAll('.card');
  cards.forEach(card => {
    card.addEventListener('click', () => handleChoice(card.dataset.side, cards));
  });
}

function handleChoice(side, cards){
  cards.forEach(c => {
    c.classList.toggle('selected', c.dataset.side === side);
    c.classList.toggle('dimmed', c.dataset.side !== side);
  });
  const statusRow = document.getElementById('status-row');
  statusRow.textContent = 'Saving...';

  const q = questionSet[current];
  const rtMs = Math.round(performance.now() - questionStartTime);
  const chosenIsIndicative = side === 'left' ? q.leftIsIndicative : !q.leftIsIndicative;

  const entry = {
    participant_id: PARTICIPANT_ID,
    study_id: STUDY_ID,
    session_id: SESSION_ID,
    pair_id: q.pairId,
    question_index: current,
    chosen_side: side,
    chosen_matches_model: chosenIsIndicative,
    reaction_time_ms: rtMs,
    timestamp: new Date().toISOString(),
  };

  const isLast = current === questionSet.length - 1;
  logResponse(entry).finally(() => {
    statusRow.textContent = isLast ? 'Saved. Finishing up…' : 'Saved.';
    setTimeout(() => {
      current += 1;
      renderQuestion();
    }, isLast ? 500 : 260);
  });
}

function renderEnd(){
  const redirect = CONFIG.PROLIFIC_COMPLETION_URL;
  app.innerHTML = `
    <div class="panel" style="text-align:center;">
      <div class="end-icon">✓</div>
      <h1 style="text-align:center;">Thanks for taking part</h1>
      <p>${redirect
        ? "You're all set — redirecting you back now."
        : "Your responses have been recorded. You may close this tab."}</p>
      ${!CONFIG.APPS_SCRIPT_URL
        ? '<p class="fine-print">Preview mode: APPS_SCRIPT_URL is not configured, so nothing was actually saved. Responses collected this session are logged to the browser console.</p>'
        : ''}
    </div>
  `;
  if (!CONFIG.APPS_SCRIPT_URL){
    console.log('Session responses (preview mode):', responses);
  }
  if (redirect){
    setTimeout(() => { window.location.href = redirect; }, 900);
  }
}

renderIntro();
</script>
</body>
</html>
